requirements:
  # File-level author comment. It is not part of the requirement model.
  - id: "CHILD"
    # A comment may follow the opener.
    title: "Derived child behavior"
    # A comment may occur between complete scalar fields.
    allocation: "Subsystem"
    # A comment may precede a prose field, but not its body.
    statement: >-
      The subsystem shall provide the behavior allocated by the parent
      requirement.
    # The preceding prose body is complete here.
    rationale: >-
      The child identifies a separately reviewable implementation responsibility.
    # A comment may precede a relationship.
    decomposes:
      - "TOP"
    # A comment may precede the closer.

  # A comment line by itself separates adjacent records.
  - id: "LEAF"
    title: "Leaf timing behavior"
    statement:
      - prose: >-
          The component shall complete the behavior within the interval defined
          by:
      - math:
          language: latex
          payload: |-
            t_{complete} - t_{start} \le 100\,\mathrm{ms}
      - prose: >-
          The interval uses a monotonic time source.
    # Math and prose content are complete before this comment.
    source: "TEST-SOURCE, revision A, section 4.2"
    decomposes:
      - "CHILD"
      - "TOP"
    # Comments may occur between repeated relationship fields.

  # Blank and comment lines may be combined between records.
  - id: "TOP"
    title: "Top-level behavior"
    allocation: "System"
    statement:
      - prose: >-
          The system shall provide the required externally observable behavior.
      - prose: >-
          The behavior shall remain available throughout normal operation.
    rationale: >-
      The top-level requirement defines the user-visible outcome independently of
      implementation.
    source: "TEST-SOURCE, revision A, section 4"

  # A trailing comment is permitted after the final record.
