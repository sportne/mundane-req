requirements:
  - id: "OPS-004"
    title: "Loss-of-link safety response"
    allocation: "Mission-control system"
    statement: >-
      When the command link to the active vehicle remains unavailable beyond the
      configured loss tolerance, the mission-control system shall initiate the
      configured safe-recovery response.
    rationale: >-
      Continuing a mission without a usable command link can exceed the assumed
      operational risk.
    source: "SRC-SAFETY-001"

  - id: "SYS-006"
    title: "Command-link loss determination"
    allocation: "Link monitor"
    statement:
      - prose: >-
          While a vehicle is active, the mission-control system shall declare its
          command link unavailable at the first link-evaluation instant defined by
          the following mathematical expression.
      - math:
          language: latex
          payload: |-
            k^\ast = \min\left\{k \in \{0,1,2,\ldots\} \mid
            t_0 + k T_{\mathrm{eval}} - t_{\mathrm{last}} \ge T_{\mathrm{loss}}\right\},
            \qquad
            t_{\mathrm{detect}} = t_0 + k^\ast T_{\mathrm{eval}}

            T_{\mathrm{loss}} = 2.0\,\mathrm{s},
            \qquad
            0 < T_{\mathrm{eval}} \le 0.10\,\mathrm{s}
      - prose: >-
          t_0 is the first scheduled link-evaluation time after vehicle
          activation, in seconds. k is a nonnegative integer evaluation index.
          T_eval is the fixed interval between evaluations, in seconds. t_last is
          the monotonic receipt time of the most recent valid vehicle message, or
          the vehicle activation time if no valid vehicle message has yet been
          received, in seconds. T_loss is the configured link-loss tolerance, in
          seconds. t_detect is the time at which the link is declared unavailable,
          in seconds.
    rationale: >-
      The expression makes the threshold boundary and evaluation quantization
      explicit rather than hiding them in prose.
    source: "SRC-SAFETY-001"
    decomposes:
      - "OPS-004"
