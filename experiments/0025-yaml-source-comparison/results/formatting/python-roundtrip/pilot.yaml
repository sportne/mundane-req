%YAML 1.2
---
requirements:
  - id: "NEED-001"
    title: "Local awareness of storage conditions"
    statement: >-
      Clinic personnel need to recognize current refrigerator conditions,
      temperature excursions, and monitoring faults while they are at the storage
      site.
    rationale: >-
      Local awareness supports timely programme action and must not depend on
      wide-area connectivity.
    source: "CDC-PINK-5:Monitoring Vaccine Temperatures + PILOT-CONTEXT:CTX-EXCURSION"

  - id: "NEED-004"
    title: "Investigable historical record"
    statement: >-
      Authorized users need retained time-correlated monitoring, alarm, and fault
      records sufficient to investigate excursions and equipment performance.
    rationale: >-
      A current indication alone cannot support trend review, excursion
      investigation, or demonstration of prior conditions.
    source: "CDC-PINK-5:Monitoring Vaccine Temperatures"

  - id: "NEED-005"
    title: "Controlled employer data access"
    statement: >-
      The employer needs to control who can access its raw and summarized
      monitoring data throughout the contracted service period.
    rationale: >-
      Hosting the data outside the clinic must not transfer programme ownership or
      grant unrestricted access.
    source: "WHO-EM01.2:4.2.19-4.2.20"

  - id: "SYS-001"
    title: "Acquire logger observations"
    allocation: "SVEMS"
    statement: >-
      SVEMS shall acquire each available time-based refrigerator data object from
      the connected logger at least once every 15 minutes.
    rationale: >-
      The system cannot display, alarm on, or transmit observations that it has
      not acquired within the source recording interval.
    source: "WHO-EM01.2:4.2.6"
    decomposes:
      - "NEED-001"
      - "NEED-004"

  - id: "SYS-009"
    title: "Retain hosted monitoring records"
    allocation: "SVEMS"
    statement: >-
      SVEMS shall make raw observations, alarms, faults, and derived summaries
      available to authorized employer users for at least five years after their
      recorded time.
    rationale: >-
      The employer's changed service period supports a longer programme audit and
      investigation horizon.
    source: "CR-001 + WHO-EM01.2:4.2.19"
    decomposes:
      - "NEED-004"
      - "NEED-005"
