format: "mundanereq-yaml-0.3"
# Original fictional watershed-monitoring corpus for operational trials.
requirements:
  - id: "OPS-MAINTAIN-001"
    title: "Maintain deployed stations"
    statement:
      - prose: "The monitoring service shall support diagnosis and controlled maintenance of deployed stations."
    rationale:
      - "Remote stations require observable and bounded maintenance without routine site visits."
  - id: "SYS-MAINTAIN-HEALTH-001"
    title: "Report station health"
    statement:
      - prose: "Each station shall report power, storage, sensor, processor, and communication health at least every five minutes."
    decomposes:
      - "OPS-MAINTAIN-001"
  - id: "EDGE-HEALTH-001"
    title: "Collect component health"
    statement:
      - prose: "The station processor shall collect health observations from each configured station component."
    decomposes:
      - "SYS-MAINTAIN-HEALTH-001"
  - id: "API-HEALTH-001"
    title: "Present station health"
    statement:
      - prose: "The maintenance interface shall present the latest health observations and their collection times for a requested station."
    decomposes:
      - "SYS-MAINTAIN-HEALTH-001"
  - id: "SYS-MAINTAIN-CONFIG-001"
    title: "Update station configuration"
    statement:
      - prose: "The service shall apply an authorized configuration update atomically or retain the previous valid configuration."
    decomposes:
      - "OPS-MAINTAIN-001"
  - id: "CONFIG-VERIFY-001"
    title: "Verify configuration package"
    statement:
      - prose: "The station processor shall verify the identity, integrity, and applicability of a configuration package before activation."
    decomposes:
      - "SYS-MAINTAIN-CONFIG-001"
  - id: "CONFIG-ROLLBACK-001"
    title: "Retain prior configuration"
    statement:
      - prose: "The station processor shall restore the previous valid configuration when activation of an update fails."
    decomposes:
      - "SYS-MAINTAIN-CONFIG-001"
  - id: "SYS-MAINTAIN-CALIBRATE-001"
    title: "Manage sensor calibration"
    statement:
      - prose: "The service shall apply and track sensor calibration and report upcoming calibration due dates."
    decomposes:
      - "OPS-MAINTAIN-001"
  - id: "CAL-APPLY-001"
    title: "Apply calibration data"
    statement:
      - prose: "The station processor shall apply the active calibration data when converting each raw sensor sample."
    decomposes:
      - "SYS-MAINTAIN-CALIBRATE-001"
  - id: "CAL-DUE-001"
    title: "Report calibration due"
    statement:
      - prose: "The maintenance interface shall identify sensors whose calibration is due within 30 days."
    decomposes:
      - "SYS-MAINTAIN-CALIBRATE-001"
