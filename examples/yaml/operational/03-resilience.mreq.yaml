format: "mundanereq-yaml-0.3"
# Original fictional watershed-monitoring corpus for operational trials.
requirements:
  - id: "OPS-RESILIENT-001"
    title: "Continue during infrastructure outages"
    statement:
      - prose: "The monitoring service shall preserve essential monitoring and alerting capability during bounded power and communication outages."
    rationale:
      - "Severe weather can disrupt the infrastructure needed to observe the same event."
  - id: "SYS-RESILIENT-POWER-001"
    title: "Operate on reserve power"
    statement:
      - prose: "Each station shall continue sampling and local hazard detection for at least 24 hours after loss of external power."
    decomposes:
      - "OPS-RESILIENT-001"
  - id: "POWER-RESERVE-001"
    title: "Supply reserve energy"
    statement:
      - prose: "The station power unit shall provide energy for 24 hours of essential station operation without external input."
    decomposes:
      - "SYS-RESILIENT-POWER-001"
  - id: "EDGE-LOWPOWER-001"
    title: "Enter essential mode"
    statement:
      - prose: "The station processor shall disable nonessential functions within one minute after detecting loss of external power."
    decomposes:
      - "SYS-RESILIENT-POWER-001"
  - id: "SYS-RESILIENT-STORE-001"
    title: "Store data during communication loss"
    statement:
      - prose: "Each station shall retain at least 72 hours of samples and detected hazards while communication is unavailable."
    decomposes:
      - "OPS-RESILIENT-001"
  - id: "EDGE-STORE-001"
    title: "Buffer samples locally"
    statement:
      - prose: "The station processor shall store qualified samples in nonvolatile local storage when delivery is unavailable."
    decomposes:
      - "SYS-RESILIENT-STORE-001"
  - id: "EDGE-PRIORITY-001"
    title: "Preserve hazard records"
    statement:
      - prose: "The station processor shall retain detected hazard records in preference to ordinary samples when local storage is exhausted."
    decomposes:
      - "SYS-RESILIENT-STORE-001"
  - id: "SYS-RESILIENT-RECOVER-001"
    title: "Recover after communication restoration"
    statement:
      - prose: "Each station shall resume current-data delivery and transfer retained records after communication is restored."
    decomposes:
      - "OPS-RESILIENT-001"
  - id: "LINK-RECONNECT-001"
    title: "Reestablish station link"
    statement:
      - prose: "The communication unit shall retry connection using bounded backoff until the gateway acknowledges the station."
    decomposes:
      - "SYS-RESILIENT-RECOVER-001"
  - id: "EDGE-BACKLOG-001"
    title: "Transfer retained records"
    statement:
      - prose: "The station processor shall transfer retained hazard records before retained ordinary samples."
    decomposes:
      - "SYS-RESILIENT-RECOVER-001"
